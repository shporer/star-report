# star-report defaults. A ./config.yaml or --config file only needs the keys it changes.
output:
  dir: reports
  open_single: true            # open the HTML report when there is exactly one target
  pdf: true                    # also print report.pdf with a headless Chromium browser (--no-pdf skips it)
  pdf_paper: letter            # letter or a4
  pdf_timeout_s: 60            # the browser is stopped at this deadline
  pdf_browsers:                # the first that exists is used: a full path, or a command on PATH
    - /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    - /Applications/Chromium.app/Contents/MacOS/Chromium
    - /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
    - google-chrome
    - google-chrome-stable
    - chromium
    - chromium-browser
    - microsoft-edge
servers:                       # the first host that answers its probe is used (checked once per run)
  simbad: [simbad.cds.unistra.fr, simbad.harvard.edu]
  vizier: [vizier.cds.unistra.fr, vizier.cfa.harvard.edu]
  probe_timeout_s: 5           # per host; a host that has not answered by then is skipped
  probes:                      # one small GET per host; it must answer HTTP 200 with one of content_types
    simbad:
      path: /simbad/sim-tap/sync
      params: {REQUEST: doQuery, LANG: ADQL, QUERY: SELECT TOP 1 main_id FROM basic}
      content_types: [application/x-votable+xml, text/xml]
    vizier:
      path: /viz-bin/votable   # the endpoint astroquery's query_region and query_constraints use
      params: {-source: I/239/hip_main, -out: HIP, -out.max: 1}
      content_types: [application/x-votable+xml, text/xml]
cache:
  dir: ~/.cache/star-report
  empty_expiry_days: 1         # an empty result is rechecked after 1 day, whatever its group
  expiry_days:                 # null = never expires; replaced only by --refresh
    gaia: 90
    tic: 90
    vizier: 90
    simbad: 30
    exoplanet_archive: 1
    exofop: 1
    mast: 7
    eso: 7
    koa: 7
    ads: 7
    llm: null
sources:
  max_workers: 8
  timeout_s: 30
  timeout_overrides: {mast: 90}   # per-source timeouts in seconds; others use timeout_s
  enabled: {simbad: true, gaia_core: true, gaia_neighbors: true, tic: true,
            exoplanet_archive: true, exofop: true, gaia_nss: true, gaia_vari: true,
            wide_binaries: true, wds: true, sb9: true, vsx: true, mast: true,
            tess_pointing: true, eso: true, koa: true, harps_rvbank: true,
            apogee: true, lamost: true, ads: true}
  radius_arcsec: {gaia_neighbors: 215, wds: 10, sb9: 5, vsx: 5, harps_rvbank: 5,
                  apogee: 3, lamost: 3, mast: 3, eso: 5, koa: 10}
  vizier_catalogs: {wds: B/wds/wds, sb9: B/sb9, vsx: B/vsx/vsx, wide_binaries: J/MNRAS/506/2269/catalog,
                    harps_rvbank: J/A+A/636/A74, apogee: III/286/catalog, lamost: V/162/dr11sl}
  # lamost = V/162/dr11sl (DR11 low-res stellar parameters). Columns used by parse_lamost: ObsID, Obs.Date,
  # snru/snrg/snrr/snri/snrz (S/N, the largest picks the best row), Teff, logg, [Fe/H]
  koa_instruments: [hires, kpf, nirspec, esi, nirc2, nires, mosfire]
  # Share of KOA's source timeout the instrument queries may use. The rest lets KOA return the
  # instruments that answered before the runner's own timeout, so a hung one is "not checked".
  koa_instrument_timeout_fraction: 0.8
resolve:
  match_radius_arcsec: 5       # coordinates or SIMBAD position -> nearest Gaia DR3 / TIC
  coord_search_arcsec: 200     # candidate cone for coordinate input (covers J2000 positions of high-PM stars)
  pair_radius_arcsec: 2
  pair_max_delta_g: 3
  max_mag_mismatch: 3.0        # positional fallbacks must agree in brightness
parameters:
  disagreement_sigma: 3
  disagreement_fraction: 0.10
  disagreement_absolute: {logg: 0.2, mh: 0.2, V: 0.1, G: 0.05}   # replaces the fraction for log/mag rows
flags:
  ruwe_max: 1.4
  contamination_max: 0.1
plots:
  enabled: true
  max_sectors: 10
  lightcurve_timeout_s: 120
  # TESS quality bits dropped on top of lightkurve's default mask. Bit 30 (value 2^30) is QLP's
  # own exclusion flag: in TIC 133788692 Sector 81 it marks stray-light spikes up to 2470 times
  # the median flux that the default mask kept. Kepler and K2 keep lightkurve's default mask.
  lightcurve_exclude_quality_bits: [30]
  # Flux columns used instead of a product's default when present: QLP's detrended flux
  # (kspsap_flux in older QLP files, det_flux in newer ones). SPOC products keep PDCSAP.
  lightcurve_detrended_columns: [kspsap_flux, det_flux]
  # Known QLP time-stamp errors, removed from QLP light curves of these sectors (sector: model),
  # as the AutoTTV project does (see plots/qlp_time.py). s1415: Sectors 14 and 15, wrong observer
  # position in QLP's barycentric correction. s7479: the ecliptic-frame ephemeris used as
  # equatorial; QLP fixed Sectors 74-79 in its v02 files (which MAST serves), but Sector 80 (v01)
  # still has it. The shifts are minutes (7-8 min for TIC 385180287 in Sector 14). Set a sector to
  # null to turn its correction off. SPOC and TESS-SPOC products are never changed.
  qlp_time_corrections: {14: s1415, 15: s1415, 80: s7479}
  # Phase-folded light curve: drawn when the highest periodogram peak up to fold_max_period_d has a
  # Baluev false-alarm probability below fold_fap_max in the combined data, and the same period
  # (within fold_period_tolerance) is the top peak below fold_fap_max in at least
  # fold_min_segments independent segments and in at least half of them. Segments are sectors,
  # or a single sector's two orbits. Systematics rarely repeat at one period across sectors.
  fold_max_period_d: 10
  fold_fap_max: 0.001
  fold_period_tolerance: 0.01
  fold_min_segments: 2
  # The light-curve and folded plots fit their y-axis to the data without isolated outliers: single
  # points that differ from both neighbors, on the same side, by more than this many robust
  # standard deviations of the point-to-point differences. Runs of two or more points (transits,
  # eclipses) always count. Nothing is removed from the data, and a note gives how many points fall
  # outside the plotted range. TIC 385180287 Sector 40 has two such points, at 0.25 and 0.42.
  isolated_outlier_sigma: 5
  cutout_arcmin: 5
  sky_survey: CDS/P/DSS2/red   # hips2fits HiPS ID (CDS)
  sky_fallback_survey: poss2ukstu_red   # STScI DSS cutout service, used when CDS is unreachable
  neighbor_max_delta_g: 6
  tess_pixel_arcsec: 21
  # The CMD background ships with the package; these two are used only by
  # scripts/make_cmd_background.py, which rebuilds it from the Gaia archive.
  cmd_background_rows: 50000
  cmd_background_timeout_s: 120
  periodogram_min_period_d: 0.1
  periodogram_max_period_d: 30
  period_merge_tolerance: 0.01   # relative; known periods closer than this share one line
literature:
  max_records: 200
  doctypes: [article, eprint]
  most_cited: 15
  most_recent: 10
llm:
  enabled: true
  backend: api                 # api: Anthropic API (ANTHROPIC_API_KEY or `ant auth login`)
                               # claude-code: `claude -p` on your Claude Code login; no API key
  model: claude-opus-5-5
  effort: high
  max_tokens: 16000            # api only; Claude Code sets its own output limit
  server_fallback: true        # api only
  timeout_s: 300               # api only: per request (SDK default 600)
  max_retries: 1               # api only: SDK retries on connection errors, 408, 409, 429 and 5xx (SDK default 2)
  claude_code:
    command: claude            # a name on PATH or a full path
    timeout_s: 600             # the whole call; claude is stopped at the deadline
