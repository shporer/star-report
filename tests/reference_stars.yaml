# Star no TESS sector covers. Selection: tess_stars2px_function_entry (tess-point 0.9.5, sectors
# through 134) on the barycentric true ecliptic at latitude 0 in 5 deg steps, then 1 deg steps, then
# latitude +2 and -2 in 1 deg steps (the brief's recipe): every point was covered. (tess-point
# answers sector -1 for "no sector"; covered means some sector > 0.) Fallback, a 2 deg whole-sky
# grid (ecliptic lon 0-358, lat -90..90, 16380 points): 70 uncovered points, all in thin gaps at
# ecliptic latitude about +14, +18 and -18. SIMBAD cones of 1.5 deg around each (Harvard mirror:
# SELECT b.main_id, b.ra, b.dec, f.V FROM basic AS b JOIN allfluxes AS f ON f.oidref = b.oid
# WHERE CONTAINS(POINT('ICRS', b.ra, b.dec), CIRCLE('ICRS', <ra>, <dec>, 1.5)) = 1 AND f.V < 9),
# kept the stars with no tess-point sector (131), then TESScut's sector list
# (mast.stsci.edu/tesscut/api/v0.1/sector?ra=..&dec=..&radius=0) had to be empty as well. The
# brighter ones nearest the ecliptic (HD 125489, HD 125453, HD 114) have a TESScut sector;
# taken: HD 125231 (V 8.41, ecliptic latitude 14).
