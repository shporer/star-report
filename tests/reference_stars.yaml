# simbad.lookup("TIC <ID>") is empty and with no SIMBAD object within 5 arcsec, checked on the
# Harvard mirror with: SELECT main_id FROM basic WHERE CONTAINS(POINT('ICRS', ra, dec),
# CIRCLE('ICRS', <ra>, <dec>, 5/3600.)) = 1. First candidate (Tmag 15.19) passed. No SIMBAD entry,
# so simbad_main_id is null and the report's `simbad` source is skipped.
