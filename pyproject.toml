[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "star-report"
dynamic = ["version"]
description = "Look up a star and write a report"
requires-python = ">=3.11"
dependencies = [
    "astroquery>=0.4.10",
    "astropy>=7.0",
    "pyvo>=1.6",
    "lightkurve>=2.5",
    "tess-point>=0.9.5",
    "tesswcs>=1.9",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "requests>=2.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13",
    "pydantic>=2.7",
    "anthropic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-socket>=0.7"]

[project.scripts]
star-report = "star_report.cli:main"

[tool.hatch.version]
path = "src/star_report/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/star_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: queries real services; run with -m live"]
addopts = "-m 'not live' --disable-socket --allow-unix-socket"
