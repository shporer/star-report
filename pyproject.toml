[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "star-report"
dynamic = ["version"]
description = "Gather catalog, archive, light-curve and literature data on a star into one report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Avi Shporer" }]
keywords = ["astronomy", "exoplanets", "TESS", "Gaia", "catalogs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11"
dependencies = [
    "astroquery>=0.4.10",
    "astropy>=7.0",
    "pyvo>=1.6",
    "lightkurve>=2.5",
    "tess-point>=0.9.5",
    "tesswcs>=1.9",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "requests>=2.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13",
    "pydantic>=2.7",
    "anthropic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-socket>=0.7"]

[project.urls]
Homepage = "https://github.com/shporer/star-report"
Issues = "https://github.com/shporer/star-report/issues"

[project.scripts]
star-report = "star_report.cli:main"

[tool.hatch.version]
path = "src/star_report/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/star_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: queries real services; run with -m live"]
addopts = "-m 'not live' --disable-socket --allow-unix-socket"
